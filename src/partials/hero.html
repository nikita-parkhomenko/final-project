<section class="section hero" id="hero">
  <div class="container">
    <picture>
      <source
        srcset="./img/hero/desktop-1x.webp 1x, ./img/hero/desktop-2x.webp 2x, ./img/hero/desktop-3x.webp 3x"
        type="image/webp"
        media="(min-width: 1280px)"
      />
      <source
        srcset="./img/hero/desktop-1x.jpg 1x, ./img/hero/desktop-2x.jpg 2x, ./img/hero/desktop-3x.jpg 3x"
        type="image/jpeg"
        media="(min-width: 1280px)"
      />
      <source
        srcset="./img/hero/tablet-1x.webp 1x, ./img/hero/tablet-2x.webp 2x, ./img/hero/tablet-3x.webp 3x"
        type="image/webp"
        media="(min-width: 768px)"
      />
      <source
        srcset="./img/hero/tablet-1x.jpg 1x, ./img/hero/tablet-2x.jpg 2x, ./img/hero/tablet-3x.jpg 3x"
        type="image/jpeg"
        media="(min-width: 768px)"
      />
      <source
        srcset="./img/hero/mobile-1x.webp 1x, ./img/hero/mobile-2x.webp 2x, ./img/hero/mobile-3x.webp 3x"
        type="image/webp"
      />
      <source
        srcset="./img/hero/mobile-1x.jpg 1x, ./img/hero/mobile-2x.jpg 2x, ./img/hero/mobile-3x.jpg 3x"
        type="image/jpeg"
      />
      <img class="hero-image" src="./img/hero/desktop-1x.jpg" alt="Student smiling while learning English" />
    </picture>

    <h1 class="hero-title">Discover the joy of learning <span class="highlight">English</span> with us!</h1>

    <a class="btn btn-primary hero-btn" href="#application" aria-label="Leave an application">Leave an application</a>

    <a class="scroll-btn" href="#footer" aria-label="Scroll to bottom">
      <svg class="scroll-icon" width="20" height="20"><use href="./img/sprite.svg#icon-Vector"></use></svg>
    </a>
  </div>
</section>
